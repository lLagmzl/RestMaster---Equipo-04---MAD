name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  revisar-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar archivos principales
        run: |
          test -f index.html
          test -f css/style.css
          test -d js

      - name: Revisar sintaxis de JavaScript
        run: |
          status=0
          for f in $(find js -name '*.js'); do
            echo "Revisando $f"
            node --check "$f" || status=1
          done
          exit $status
