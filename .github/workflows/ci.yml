name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_DIR: "Avance del Sprint 2"

jobs:
  revisar-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mostrar archivos de la aplicación
        run: find "$APP_DIR" -type f | sort

      - name: Revisar archivos principales
        run: |
          test -f "$APP_DIR/index.html" || { echo "Falta index.html en $APP_DIR"; exit 1; }
          test -f "$APP_DIR/css/style.css" || { echo "Falta css/style.css en $APP_DIR"; exit 1; }
          test -d "$APP_DIR/js" || { echo "Falta la carpeta js en $APP_DIR"; exit 1; }

      - name: Revisar sintaxis de JavaScript
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "Revisando $f"
            node --check "$f" || { cp "$f" /tmp/revisar.mjs && node --check /tmp/revisar.mjs; } || status=1
          done < <(find "$APP_DIR/js" -name '*.js' -print0)
          exit $status
